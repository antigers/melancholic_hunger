plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'Xander Maven'
		url = 'https://maven.isxander.dev/releases'
	}
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://jitpack.io"
			}
		}
		filter {
			includeGroup "com.github.Chocohead"
		}
	}
	maven {
		// Reach Entity Attributes (Required by Porting Lib)
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}
	maven {
		url = "https://mvn.devos.one/releases/"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.parchment_mappings}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// YACL
	modImplementation "dev.isxander:yet-another-config-lib:${project.YACL_version}"

	// Cardinal Components API
	include (modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.CCA_version}")
	include (modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.CCA_version}")

	// ModMenu compatibility
	modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Architectury (Nostalgic Tweaks dependency)
	modApi "dev.architectury:architectury-fabric:${project.architectury_version}"

	// Nostalgic Tweaks compatibility
	modImplementation "maven.modrinth:nostalgic-tweaks:${project.nostalgic_tweaks_version}"

	// Immediately Fast compatibility
	modImplementation "maven.modrinth:immediatelyfast:${project.immediately_fast_version}"

    //Raised compatibility
    modImplementation "maven.modrinth:raised:${project.raised_version}"

	// Manningham Mills (Farmer's Delight dependency)
	modImplementation("com.github.Chocohead:Fabric-ASM:${manningham_mills_version}") {
		exclude (group: "net.fabricmc.fabric-api")
	}

	// Porting-Lib (Farmer's Delight dependency)
	for (String module in ["base", "config", "networking", "loot", "lazy_registration", "recipe_book_categories"]) {
		modApi("io.github.fabricators_of_create.Porting-Lib:$module:$port_lib_version")
	}

	// Farmer's Delight compatibility
    modImplementation "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

loom {
	// adding access widener to the build
	accessWidenerPath = file("src/main/resources/melancholic_hunger.accesswidener")
}